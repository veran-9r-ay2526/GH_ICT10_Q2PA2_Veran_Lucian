<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participation Activity 2</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <style>
        :root {
            --bg: #FFE66D;
            --card: #FFFFFF;
            --ink: #2B2350;
            --muted: #6B5F8F;
            --red: #FF595E;
            --blue: #4CC9F0;
            --purple: #7B5CFA;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 18px;
            background-color: var(--bg);
            background-image:
                radial-gradient(var(--blue) 2px, transparent 2.5px),
                radial-gradient(var(--red) 2px, transparent 2.5px);
            background-size: 48px 48px;
            background-position: 0 0, 24px 24px;
            color: var(--ink);
            font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 480px;
            margin: 0 auto 28px;
            padding: 22px;
            background: var(--card);
            border: 3px solid var(--ink);
            border-radius: 24px;
            box-shadow: 6px 6px 0 var(--ink);
        }

        form br { display: none; }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font: inherit;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--ink);
            background: transparent;
            border: 3px solid var(--ink);
            border-radius: 16px;
        }

        input[type="text"]::placeholder { color: var(--muted); }

        input[type="text"]:focus-visible,
        input[type="button"]:focus-visible {
            outline: 4px solid var(--blue);
            outline-offset: 2px;
        }

        input[type="button"] {
            padding: 12px 22px;
            font: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            background: var(--red);
            border: 3px solid var(--ink);
            border-radius: 16px;
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
        }

        input[type="button"]:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        input[type="button"]:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 var(--ink);
        }

        #div1 {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 22px;
            background: var(--card);
            border: 3px solid var(--ink);
            border-radius: 24px;
            box-shadow: 6px 6px 0 var(--purple);
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        #div1:empty,
        #div1:blank { display: none; }

        @media (prefers-reduced-motion: reduce) {
            input[type="button"] { transition: none; }
        }
    </style>
</head>
<body>
    <form>
        <input type="text" id="fname" placeholder="Enter your first name"><br>
        <input type="text" id="lname" placeholder="Enter your last name"><br>
        <input type="button" py-click="get_name" value="Search">
    </form>

    <div id="div1"></div>
    <py-script src="main.py"></py-script>
</body>
</html>
